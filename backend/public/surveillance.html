<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Surveillance</title>
    <link rel="stylesheet" href="surveillance.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
            <h1>Retro Booth Backend Surveillance</h1>
            <button id="bulk-print-btn" disabled style="padding: 10px 20px; font-size: 1.1rem; background: #9E8BA6; color: #150B19; border: none; border-radius: 6px; cursor: not-allowed; transition: all 0.2s;">
                Print Selected (0)
            </button>
        </div>
        <div class="stats">
            <div class="stat-box">Processed: <span id="stat-processed">0</span></div>
            <div class="stat-box">Printed: <span id="stat-printed">0</span></div>
            <div class="stat-box">Errors: <span id="stat-errors">0</span></div>
        </div>
    </header>
    <main>
        <div class="column">
            <h2>Live Activity</h2>
            <div id="live-feed" class="feed-container"></div>
        </div>
        <div class="column">
            <h2>Print Queue</h2>
            <ul id="print-queue" class="queue-list"></ul>
        </div>
    </main>
    
    <!-- Include Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="surveillance.js"></script>
</body>
</html>
